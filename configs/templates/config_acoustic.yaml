base_config:
  - configs/acoustic.yaml

dictionaries:
  zh: "dictionaries/opencpop-extension.txt"
  ja: dictionaries/dictionary-ja.txt
extra_phonemes: []
merged_phoneme_groups:
  - ["zh/i", "ja/i"]
  - ["SP", "ja/cl"]

datasets:
  - raw_data_dir: data/opencpop/raw
    speaker: opencpop
    spk_id: 0
    language: zh
    test_prefixes:
      - "2001000001"
      - "2001000002"
      - "2001000003"
  - raw_data_dir: data/itako/raw
    speaker: itako
    spk_id: 1
    language: ja
    test_prefixes:
      - "itako02_seg036"
      - "itako02_seg037"
      - "itako02_seg038"
  - raw_data_dir: data/kiritan/raw
    speaker: kiritan
    spk_id: 2
    language: ja
    test_prefixes:
      - "01_000"
      - "02_000"
      - "03_000"
  - raw_data_dir: data/karasu/raw
    speaker: karasu
    spk_id: 3
    language: ja
    test_prefixes:
      - "bc_seg0"

binary_data_dir: data/testssm/aco/binary/
binarization_args:
  shuffle: false
  num_workers: 4             # GPU训练时适量workers即可
coverage_check_option: compat
pe: parselmouth
pe_ckpt: ''
hnsep: world
hnsep_ckpt: ''
vocoder: NsfHifiGAN
vocoder_ckpt: 'checkpoints/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt'


use_lang_id: true
num_lang: 2
use_spk_id: true
num_spk: 4
use_energy_embed: false
use_breathiness_embed: true
use_voicing_embed: true
use_tension_embed: true
use_key_shift_embed: true
use_speed_embed: true

augmentation_args:
  random_pitch_shifting:
    enabled: true
  fixed_pitch_shifting:
    enabled: false
  random_time_stretching:
    enabled: true

diffusion_type: reflow
enc_ffn_kernel_size: 3
use_rope: true
use_shallow_diffusion: true   # 启用浅层扩散

# 混合 Encoder：前2层 Mamba3 (局部 SSM) + 后2层 Transformer Self-Attention (全局语义)
encoder_layer_types: ['mamba', 'mamba', 'attention', 'attention']

T_start: 0.4
T_start_infer: 0.4
K_step: 400                  # 完整扩散步数
K_step_infer: 400
sampling_steps: 20
backbone_type: 'lynxnet'
backbone_args:
  num_channels: 1024
  num_layers: 6
  kernel_size: 31
  dropout_rate: 0.1             # 防过拟合：从0.0提升到0.1
  strong_cond: true

optimizer_args:
  lr: 0.0006
  weight_decay: 0.00001        # 微量L2正则，防过拟合
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 160000
  eta_min: 0.00001

# 梯度累积（增加梯度噪声平滑，防过拟合）
accumulate_grad_batches: 2

# 训练参数优化（RTX 4090 GPU）
max_batch_frames: 50000       # 利用24GB显存
max_batch_size: 48            # 大batch size
max_updates: 160000           # 完整训练步数

# 数据加载优化
ds_workers: 4                 # DataLoader工作进程
dataloader_prefetch_factor: 2

num_valid_plots: 10
val_with_vocoder: true
val_check_interval: 2000
num_ckpt_keep: 5

# GPU训练配置（RTX 4090）
pl_trainer_devices: '1'
pl_trainer_accelerator: 'gpu'
pl_trainer_precision: '16-mixed'    # FP16混合精度加速
